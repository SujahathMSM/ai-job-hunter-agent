[project]
name = "nexushunt"
version = "2.4.0"
description = "AI job-hunting agent: live job search, CV tailoring with fact checks, and outreach drafts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Compatible ranges here; exact tested versions are locked in uv.lock
# (and exported to requirements.txt for pip users).
dependencies = [
    # API server
    "fastapi>=0.163,<1",
    "uvicorn>=0.54,<1",
    "watchfiles>=1.3,<2",            # event-based --reload (the fallback crashes on frontend/node_modules)
    "python-multipart>=0.0.32",
    "pydantic>=2.13,<3",
    "pyjwt>=2.15,<3",
    "cryptography>=50",
    "python-dotenv>=1.2,<2",
    # Scraping and parsing
    "requests>=2.34,<3",
    "beautifulsoup4>=4.15,<5",
    "python-jobspy>=1.4.1,<2",
    "curl_cffi>=0.17",
    "pandas>=3.0,<4",
    "pypdf>=6.17,<7",
    "python-docx>=1.2,<2",
    "reportlab>=5.0,<6",
    # LLM providers (each used only when its API key is set)
    "anthropic>=2.9,<3",
    "openai>=3.52,<4",
    # Google sign-in token verification
    "google-auth>=2.62,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "httpx>=0.28,<1",
]

[project.scripts]
nexushunt-cli = "cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout: top-level modules next to the packages
py-modules = ["api", "cli", "config", "net_safety", "secret_box"]
packages = ["hunter", "generators", "ingestion", "matcher", "outreach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
